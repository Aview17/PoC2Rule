# PoC2Rule Agent 配置文件

workspace:
  base_dir: ./workspace
  poc_dir: ./workspace/poc
  pcap_dir: ./workspace/pcap
  output_dir: ./workspace/output

llm:
  provider: openai          # openai / deepseek / qwen / vllm
  model: gpt-4o
  temperature: 0.1
  max_tokens: 4096
  api_key: ${OPENAI_API_KEY}
  base_url: ""

plugins:
  enabled:
    - snort
  snort:
    snort_bin: snort
    config_path: /etc/snort/snort.conf

# 工作流节点配置
workflow:
  max_retries: 3
  timeout: 300

logging:
  level: INFO
  format: "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s"
  file: ./logs/app.log
